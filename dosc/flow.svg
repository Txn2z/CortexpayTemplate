<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 190" width="940" height="190" role="img" aria-labelledby="t d">
  <title id="t">Alur pembayaran CortexPay QRIS</title>
  <desc id="d">Empat langkah: buat transaksi, tampil QRIS, pembeli bayar, konfirmasi pembayaran.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#168653" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="938" height="188" rx="14" fill="#ffffff" stroke="#e3e8e5"/>

  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- Step 1 -->
    <rect x="30" y="38" width="190" height="114" rx="10" fill="#f5faf7" stroke="#cfe3d8"/>
    <circle cx="58" cy="68" r="14" fill="#168653"/>
    <text x="58" y="73" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="80" y="73" font-size="16" font-weight="700" fill="#14231c">Buat transaksi</text>
    <text x="50" y="105" font-size="13" fill="#5b6b63">Kirim nominal dan Order ID</text>
    <text x="50" y="126" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#168653">POST /pay/v1/create</text>

    <!-- Step 2 -->
    <rect x="260" y="38" width="190" height="114" rx="10" fill="#f5faf7" stroke="#cfe3d8"/>
    <circle cx="288" cy="68" r="14" fill="#168653"/>
    <text x="288" y="73" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="310" y="73" font-size="16" font-weight="700" fill="#14231c">Tampil QRIS</text>
    <text x="280" y="105" font-size="13" fill="#5b6b63">QR code dirender otomatis</text>
    <text x="280" y="126" font-size="13" fill="#5b6b63">dari qris_payload</text>

    <!-- Step 3 -->
    <rect x="490" y="38" width="190" height="114" rx="10" fill="#f5faf7" stroke="#cfe3d8"/>
    <circle cx="518" cy="68" r="14" fill="#168653"/>
    <text x="518" y="73" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="540" y="73" font-size="16" font-weight="700" fill="#14231c">Pembeli bayar</text>
    <text x="510" y="105" font-size="13" fill="#5b6b63">Scan lewat e-wallet</text>
    <text x="510" y="126" font-size="13" fill="#5b6b63">atau m-banking</text>

    <!-- Step 4 -->
    <rect x="720" y="38" width="190" height="114" rx="10" fill="#f5faf7" stroke="#cfe3d8"/>
    <circle cx="748" cy="68" r="14" fill="#168653"/>
    <text x="748" y="73" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="770" y="73" font-size="16" font-weight="700" fill="#14231c">Konfirmasi</text>
    <text x="740" y="105" font-size="13" fill="#5b6b63">Polling tiap 3 detik</text>
    <text x="740" y="126" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#168653">status: paid</text>

  </g>

  <!-- Arrows -->
  <line x1="228" y1="95" x2="252" y2="95" stroke="#168653" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="458" y1="95" x2="482" y2="95" stroke="#168653" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="688" y1="95" x2="712" y2="95" stroke="#168653" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
